# Render Blueprint — deploys the whole WhatsApp SaaS for free.
# The web service runs BOTH the website and the background sender (worker)
# in one process, so it fits Render's free tier.
#
# To use: Render Dashboard → New → Blueprint → connect this repo.
services:
  - type: web
    name: wa-sender
    runtime: node
    plan: free
    branch: saas-platform
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && npm run start:all
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wa-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        value: thisisprafull
      - key: ADMIN_PASSWORD
        value: Prafull_2000
      - key: SEND_RATE_PER_SECOND
        value: "10"
      - key: NODE_VERSION
        value: "22"

  - type: keyvalue
    name: wa-redis
    plan: free
    ipAllowList: [] # only allow internal connections
    maxmemoryPolicy: noeviction

databases:
  - name: wa-postgres
    plan: free
